<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MH HUDLI Jewellery | Luxury Jewellery</title>

<style>
:root{
  --black:#111;
  --gold:#c7a45d;
  --lightgold:#ead8a6;
  --cream:#f8f5ef;
  --white:#fff;
  --gray:#777;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#222;background:#fff}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
img{max-width:100%}

.announcement{
  background:#111;color:#e8d5a4;text-align:center;
  padding:10px;font-size:11px;letter-spacing:1.5px
}
header{
  display:flex;align-items:center;justify-content:space-between;
  gap:15px;padding:17px 5%;background:#fff;
  border-bottom:1px solid #eee;position:sticky;top:0;z-index:20
}
.logo{font: bold 23px Georgia,serif;letter-spacing:3px}
.logo span{display:block;font:9px Arial;letter-spacing:5px;color:#9c7b3e;margin-top:5px}
nav{display:flex;gap:20px;font-size:12px;text-transform:uppercase}
nav a:hover{color:#a4823d}
.header-actions{display:flex;gap:8px}
button{border:1px solid var(--gold);background:white;padding:10px 13px}
.gold-btn{background:var(--gold);color:#111;border:1px solid var(--gold)}
.black-btn{background:#111;color:white;border-color:#111}
.icon-btn{border:0;font-size:18px;padding:8px}

.hero{
  min-height:490px;display:flex;align-items:center;padding:7%;
  color:white;background:
  linear-gradient(90deg,#070707e8,#07070755),
  url('https://images.unsplash.com/photo-1611652022419-a9419f74343d?auto=format&fit=crop&w=1600&q=85') center/cover
}
.hero-content{max-width:580px}
.eyebrow{font-size:11px;letter-spacing:4px;color:#e8d5a4;text-transform:uppercase}
.hero h1{font:clamp(42px,6vw,72px)/1.08 Georgia,serif;font-weight:normal;margin:20px 0}
.hero p{line-height:1.8;color:#ddd;max-width:480px}
.hero button{margin-top:18px;padding:14px 23px}
